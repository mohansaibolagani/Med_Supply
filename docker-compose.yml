version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: medsupply_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: medsupply_db
    volumes:
      - mongo_data:/data/db
    networks:
      - medsupply-net

  # Express REST API Backend (Member 1 & Member 3)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medsupply_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/medsupply_db
      - JWT_SECRET=medsupply_super_secret_jwt_key_2026_class_project
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - medsupply-net

  # React Vite Frontend (Member 2 & Member 3)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medsupply_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - medsupply-net

volumes:
  mongo_data:
    driver: local

networks:
  medsupply-net:
    driver: bridge
